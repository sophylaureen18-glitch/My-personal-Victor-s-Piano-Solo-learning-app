plugins { id 'com.android.application' }

android {
    namespace 'com.victor.piano'
    compileSdk 35
    defaultConfig {
        applicationId 'com.victor.piano'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}