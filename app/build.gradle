plugins { id 'com.android.application' }

android {
    namespace 'com.victor.piano'
    compileSdk 35
    defaultConfig {
        applicationId 'com.victor.piano'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }
    dependencies {
        implementation 'androidx.webkit:webkit:1.12.1'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}